# 国内构建用的 cargo 镜像配置。
#
# crates.io 的 sparse index 在这个网络下几乎拉不动（实测 >13 分钟仍在
# "Updating crates.io index"）。rsproxy 实测 0.15s 响应。
# 想用官方源就在 Dockerfile 里把 COPY 这行去掉。
[source.crates-io]
replace-with = "rsproxy-sparse"

[source.rsproxy]
registry = "https://rsproxy.cn/crates.io-index"

[source.rsproxy-sparse]
registry = "sparse+https://rsproxy.cn/index/"

[registries.rsproxy]
index = "https://rsproxy.cn/crates.io-index"

[net]
git-fetch-with-cli = true
